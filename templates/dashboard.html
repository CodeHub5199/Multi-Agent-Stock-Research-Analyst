<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StockMind — Multi-Agent Research</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230b0f14'/><polyline points='10,70 30,45 50,55 70,25 90,35' fill='none' stroke='%232dd4bf' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/><circle cx='90' cy='35' r='6' fill='%232dd4bf'/></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════════ */
:root {
  --bg:          #0b0f14;
  --bg2:         #111720;
  --bg3:         #172030;
  --border:      #1e2d40;
  --border2:     #253448;
  --text:        #d8e4f0;
  --text-dim:    #6b8299;
  --text-bright: #f0f8ff;
  --accent:      #2dd4bf;   /* teal */
  --accent2:     #f59e0b;   /* amber */
  --bull:        #34d399;
  --bear:        #f87171;
  --neutral:     #94a3b8;
  --warn:        #fbbf24;
  --font-head:   'Fraunces', Georgia, serif;
  --font-body:   'DM Sans', sans-serif;
  --font-mono:   'DM Mono', monospace;
  --radius:      10px;
  --radius-lg:   16px;
  --shadow:      0 4px 24px rgba(0,0,0,.45);
}

/* ═══════════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ═══════════════════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ═══════════════════════════════════════════════════
   HEADER / NAV
═══════════════════════════════════════════════════ */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11,15,20,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px;
}
.logo {
  font-family: var(--font-head);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: -0.5px;
}
.logo span { color: var(--accent); }
.header-meta {
  font-size: 12px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}

/* ═══════════════════════════════════════════════════
   SEARCH BAR
═══════════════════════════════════════════════════ */
.search-wrap {
  max-width: 680px;
  margin: 48px auto 0;
  padding: 0 24px;
  text-align: center;
}
.search-wrap .autocomplete-wrap,
.search-wrap .autocomplete-wrap input {
  text-align: left;
}

.search-wrap h1 {
  font-family: var(--font-head);
  font-size: 36px;
  font-weight: 300;
  color: var(--text-bright);
  letter-spacing: -1px;
  margin-bottom: 6px;
}
.search-wrap h1 em { font-style: italic; color: var(--accent); }
.search-wrap p {
  color: var(--text-dim);
  margin-bottom: 28px;
  font-size: 14px;
}
.search-row {
  display: flex; 
  gap: 10px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 6px 6px 6px 18px;
  transition: border-color .2s;
}
.search-row:focus-within { border-color: var(--accent); }
.search-row input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-bright);
  font-family: var(--font-mono);
  font-size: 15px;
  letter-spacing: 1px;
  text-align: left;
  align-self: center;
  padding: 10px 0;
}
.search-row input::placeholder { color: var(--text-dim); letter-spacing: 0; font-family: var(--font-body); font-size: 14px; }
.search-row select {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 0 10px;
  cursor: pointer;
  outline: none;
}
.btn-analyze {
  background: var(--accent);
  color: #0b0f14;
  font-weight: 600;
  font-family: var(--font-body);
  border: none;
  border-radius: 10px;
  padding: 10px 22px;
  cursor: pointer;
  font-size: 14px;
  transition: opacity .15s, transform .1s;
  white-space: nowrap;
}
.btn-analyze:hover:not(:disabled) { opacity: .85; transform: translateY(-1px); }
.btn-analyze:disabled { opacity: .4; cursor: not-allowed; }
.examples {
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-dim);
}
.examples button {
  background: none; border: 1px solid var(--border2);
  color: var(--text-dim); font-family: var(--font-mono);
  font-size: 11px; padding: 3px 9px; border-radius: 6px;
  cursor: pointer; margin: 0 3px; transition: all .15s;
}
.examples button:hover { border-color: var(--accent); color: var(--accent); }

/* ═══════════════════════════════════════════════════
   LOADER
═══════════════════════════════════════════════════ */
#loader {
  display: none;
  max-width: 480px;
  margin: 48px auto;
  text-align: center;
}
.loader-ring {
  width: 48px; height: 48px;
  border: 3px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-steps { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.step {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px;
  font-size: 13px; color: var(--text-dim);
  transition: all .3s;
}
.step.active { border-color: var(--accent); color: var(--text-bright); }
.step.done { border-color: var(--bull); color: var(--bull); }
.step-icon { font-size: 16px; }

/* ═══════════════════════════════════════════════════
   ERROR BANNER
═══════════════════════════════════════════════════ */
#error-banner {
  display: none;
  max-width: 680px;
  margin: 24px auto;
  background: rgba(248,113,113,.1);
  border: 1px solid var(--bear);
  border-radius: var(--radius);
  padding: 14px 18px;
  color: var(--bear);
  font-size: 13px;
}

/* ═══════════════════════════════════════════════════
   DASHBOARD MAIN
═══════════════════════════════════════════════════ */
#dashboard {
  display: none;
  max-width: 1180px;
  margin: 40px auto 80px;
  padding: 0 24px;
  animation: fadeUp .4s ease both;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* ── Company header ───────────────────────────── */
.company-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-wrap: wrap; gap: 16px;
  margin-bottom: 28px;
}
.company-title h2 {
  font-family: var(--font-head);
  font-size: 32px;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: -1px;
}
.company-title .ticker-badge {
  display: inline-block;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 2px 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent);
  margin-left: 10px;
  vertical-align: middle;
}
.company-meta {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px;
}
.meta-pill {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 12px;
  font-size: 11px;
  color: var(--text-dim);
}
.price-block { text-align: right; }
.price-block .price {
  font-family: var(--font-mono);
  font-size: 30px;
  font-weight: 500;
  color: var(--text-bright);
}
.price-block .price-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

/* ── Verdict banner ───────────────────────────── */
.verdict-banner {
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 24px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: center;
  border: 1px solid var(--border2);
  background: linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
  position: relative;
  overflow: hidden;
}
.verdict-banner::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 60%, rgba(45,212,191,.04));
  pointer-events: none;
}
.verdict-pill {
  font-family: var(--font-head);
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -2px;
  padding: 10px 24px;
  border-radius: 12px;
  line-height: 1;
}
.verdict-pill.hold  { color: var(--accent2); background: rgba(245,158,11,.1); border: 2px solid var(--accent2); }
.verdict-pill.buy   { color: var(--bull);    background: rgba(52,211,153,.1); border: 2px solid var(--bull); }
.verdict-pill.sell  { color: var(--bear);    background: rgba(248,113,113,.1); border: 2px solid var(--bear); }

.verdict-details h3 {
  font-family: var(--font-head);
  font-size: 15px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 4px;
}
.verdict-details p { font-size: 13px; color: var(--text-dim); max-width: 520px; }
.confidence-block { text-align: center; min-width: 90px; }
.confidence-num {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 500;
  color: var(--text-bright);
}
.confidence-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.conf-bar {
  width: 80px; height: 4px;
  background: var(--border2);
  border-radius: 2px;
  margin: 6px auto 0;
  overflow: hidden;
}
.conf-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--accent);
  transition: width 1s ease;
}

/* ── Score row ────────────────────────────────── */
.score-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}
.score-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  transition: border-color .2s;
}
.score-card:hover { border-color: var(--border2); }
.score-card .sc-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
.score-card .sc-value {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 500;
  color: var(--text-bright);
  line-height: 1;
}
.score-card .sc-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.score-card .sc-bar {
  margin-top: 10px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.score-card .sc-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 1.2s ease;
}

/* ── Section layout ───────────────────────────── */
.sections-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 820px) { .sections-grid { grid-template-columns: 1fr; } }

.section-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.section-card.full-width { grid-column: 1 / -1; }

.section-header {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
}
.section-icon { font-size: 18px; }
.section-title {
  font-family: var(--font-head);
  font-size: 15px;
  font-weight: 700;
  color: var(--text-bright);
  flex: 1;
}
.section-score {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent);
}
.section-body { padding: 18px 20px; }

/* ── KV grid ──────────────────────────────────── */
.kv-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.kv {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
}
.kv .kv-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .8px; }
.kv .kv-val {
  font-family: var(--font-mono);
  font-size: 15px;
  color: var(--text-bright);
  margin-top: 2px;
}
.kv .kv-badge {
  display: inline-block;
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 4px;
  margin-top: 4px;
}

/* ── Industry comparison bars ─────────────────── */
.ic-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.ic-label { width: 80px; font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
.ic-bars { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.ic-bar-wrap { display: flex; align-items: center; gap: 6px; }
.ic-bar-bg { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.ic-bar-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }
.ic-bar-fill.stock { background: var(--accent); }
.ic-bar-fill.ind   { background: var(--border2); }
.ic-num { width: 36px; text-align: right; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.ic-verdict { font-size: 10px; padding: 1px 7px; border-radius: 4px; flex-shrink: 0; }

/* ── Technical indicators ─────────────────────── */
.indicator-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.indicator-row:last-child { border-bottom: none; }
.ind-name { color: var(--text-dim); }
.ind-val  { font-family: var(--font-mono); color: var(--text-bright); }
.ind-tag  { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }

/* ── Signal alignment ─────────────────────────── */
.align-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.align-row:last-child { border-bottom: none; }
.align-agent { width: 110px; font-size: 12px; color: var(--text-dim); text-transform: capitalize; }
.align-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.align-bar      { height: 100%; border-radius: 3px; transition: width 1.2s ease; }
.align-score { width: 32px; text-align: right; font-family: var(--font-mono); font-size: 12px; color: var(--text-bright); }
.dir-tag { font-size: 10px; padding: 2px 7px; border-radius: 4px; min-width: 90px; text-align: center; }

/* ── News cards ───────────────────────────────── */
.news-card {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 10px;
  transition: border-color .15s;
}
.news-card:hover { border-color: var(--border2); }
.news-card:last-child { margin-bottom: 0; }
.news-title { font-size: 13px; font-weight: 500; color: var(--text-bright); margin-bottom: 4px; }
.news-summary { font-size: 12px; color: var(--text-dim); }
.news-meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.news-source { font-size: 11px; color: var(--text-dim); }

/* ── Sentiment donut ──────────────────────────── */
.sentiment-row {
  display: flex; gap: 20px; align-items: center; margin-bottom: 16px;
}
.donut-wrap { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
.donut-wrap svg { transform: rotate(-90deg); }
.donut-center {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 16px; font-weight: 500;
  color: var(--text-bright);
}
.sent-breakdown { flex: 1; }
.sent-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; }
.sent-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sent-name { color: var(--text-dim); width: 56px; }
.sent-pct  { font-family: var(--font-mono); color: var(--text-bright); }

/* ── Risk / bear cards ────────────────────────── */
.risk-card {
  border-left: 3px solid var(--bear);
  background: rgba(248,113,113,.05);
  border-radius: 0 8px 8px 0;
  padding: 10px 14px;
  margin-bottom: 10px;
  font-size: 13px;
}
.risk-card.warn { border-color: var(--warn); background: rgba(251,191,36,.05); }
.risk-card:last-child { margin-bottom: 0; }
.risk-title { font-weight: 600; color: var(--text-bright); margin-bottom: 3px; font-size: 13px; }
.risk-desc  { color: var(--text-dim); font-size: 12px; }
.risk-badges { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

/* ── Catalyst tags ────────────────────────────── */
.catalyst-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.catalyst-tag {
  background: rgba(45,212,191,.08);
  border: 1px solid rgba(45,212,191,.25);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 12px;
  color: var(--accent);
}

/* ── Data gap cards ───────────────────────────── */
.gap-card {
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: 12px;
  display: flex; gap: 10px; align-items: flex-start;
}
.gap-card:last-child { margin-bottom: 0; }
.gap-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.gap-text .gap-id { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.gap-text .gap-desc { color: var(--text); margin: 2px 0; }
.gap-text .gap-rec  { color: var(--text-dim); font-style: italic; }

/* ── Flags / cross signals ────────────────────── */
.flag-card {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px;
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 12px;
}
.flag-card.critical { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); }
.flag-card.warn     { background: rgba(251,191,36,.1);  border: 1px solid rgba(251,191,36,.3); }
.flag-card.ok       { background: rgba(52,211,153,.1);  border: 1px solid rgba(52,211,153,.3); }
.flag-card:last-child { margin-bottom: 0; }
.flag-icon { font-size: 16px; flex-shrink: 0; }
.flag-msg  { flex: 1; color: var(--text-bright); }
.flag-act  { font-size: 10px; font-family: var(--font-mono); color: var(--text-dim); }

/* ── S&R table ────────────────────────────────── */
.sr-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.sr-table th {
  text-align: left;
  color: var(--text-dim);
  font-weight: 500;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .8px;
  padding: 0 0 8px;
  border-bottom: 1px solid var(--border);
}
.sr-table td {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
}
.sr-table tr:last-child td { border-bottom: none; }

/* ── Utility ─────────────────────────────────── */
.tag {
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.tag.bull    { background: rgba(52,211,153,.15); color: var(--bull); }
.tag.bear    { background: rgba(248,113,113,.15); color: var(--bear); }
.tag.neutral { background: rgba(148,163,184,.15); color: var(--neutral); }
.tag.warn    { background: rgba(251,191,36,.15);  color: var(--warn); }
.tag.accent  { background: rgba(45,212,191,.15);  color: var(--accent); }

.divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
.mt-10 { margin-top: 10px; }
.mt-14 { margin-top: 14px; }
.section-sub { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .8px; margin: 14px 0 8px; font-weight: 600; }

/* ── Timestamp footer ────────────────────────── */
.dash-footer {
  text-align: center;
  margin-top: 40px;
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
/* ── Ticker Autocomplete ──────────────────────── */
.autocomplete-wrap { position: relative; flex: 1; min-width: 0; overflow: visible; }
#autocomplete-list {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  left: -18px;            /* align with .search-row left padding */
  min-width: 340px;
  max-height: 260px;
  overflow-y: auto;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 200;
}
.ac-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.selected { background: var(--bg3); }
.ac-ticker {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent);
  min-width: 90px;
}
.ac-name {
  color: var(--text-dim);
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ac-highlight { color: var(--text-bright); }
</style>
</head>
<body>

<!-- ══ HEADER ═══════════════════════════════════════════════════════ -->
<header>
  <div class="logo">Stock<span>Mind</span></div>
  <div class="header-meta" id="header-ts">Multi-Agent Research · Powered by LangGraph</div>
</header>

<!-- ══ SEARCH ════════════════════════════════════════════════════════ -->
<div class="search-wrap" id="search-section">
  <h1>Research any <em>stock</em>.</h1>
  <p>Five AI agents — Fundamentals · Technical · News · Synthesis · Critic — in parallel.</p>
  <div class="search-row">
    <div class="autocomplete-wrap">
      <input id="ticker-input" type="text" placeholder="Enter ticker (e.g. SBIN, RELIANCE, AAPL)" spellcheck="false" autocomplete="off"/>
      <div id="autocomplete-list"></div>
    </div>
    <!-- <select id="depth-select">
      <option value="standard">Standard</option>
      <option value="deep">Deep</option>
    </select> -->
    <button class="btn-analyze" id="analyze-btn" onclick="runAnalysis()">Analyze →</button>
  </div>
  <div class="examples">
    Try: 
    <button onclick="quickTicker('SBIN')">SBIN</button>
    <button onclick="quickTicker('RELIANCE')">RELIANCE</button>
    <button onclick="quickTicker('TCS')">TCS</button>
    <button onclick="quickTicker('AAPL')">AAPL</button>
    <button onclick="quickTicker('HDFCBANK')">HDFCBANK</button>
  </div>
</div>

<!-- ══ LOADER ════════════════════════════════════════════════════════ -->
<div id="loader">
  <div class="loader-ring"></div>
  <p style="color:var(--text-dim);font-size:13px;">Running multi-agent pipeline…</p>
  <div class="loader-steps">
    <div class="step" id="step-fund"><span class="step-icon">📊</span> Fundamentals Agent</div>
    <div class="step" id="step-tech"><span class="step-icon">📈</span> Technical Agent</div>
    <div class="step" id="step-news"><span class="step-icon">📰</span> News Agent</div>
    <div class="step" id="step-synth"><span class="step-icon">🔗</span> Synthesis Agent</div>
    <div class="step" id="step-critic"><span class="step-icon">🔍</span> Critic Agent</div>
  </div>
</div>

<!-- ══ ERROR ═════════════════════════════════════════════════════════ -->
<div id="error-banner"></div>

<!-- ══ DASHBOARD ═════════════════════════════════════════════════════ -->
<div id="dashboard"></div>

<script>
/* ═══════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

function fmt(v, decimals=2) {
  if (v == null || v === '') return '—';
  if (typeof v === 'number') return v.toFixed(decimals);
  return v;
}
function fmtPct(v) { return v == null ? '—' : v.toFixed(1) + '%'; }
function fmtPrice(v) { return v == null ? '—' : '₹' + Number(v).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtPriceRaw(v) { return v == null ? '—' : Number(v).toLocaleString('en-IN', {minimumFractionDigits:2}); }

function scoreColor(s) {
  if (s == null) return '#6b8299';
  if (s >= 7)  return '#34d399';
  if (s >= 5)  return '#f59e0b';
  return '#f87171';
}
function dirClass(d) {
  if (!d) return 'neutral';
  const dl = d.toLowerCase();
  if (dl.includes('bull')) return 'bull';
  if (dl.includes('bear')) return 'bear';
  return 'neutral';
}
function dirLabel(d) {
  if (!d) return 'Neutral';
  return d.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}
function verdictClass(v) {
  if (!v) return 'hold';
  const vl = v.toLowerCase();
  if (vl.includes('buy') || vl.includes('strong buy')) return 'buy';
  if (vl.includes('sell')) return 'sell';
  return 'hold';
}

/* ═══════════════════════════════════════════════════
   LOADER ANIMATION
═══════════════════════════════════════════════════ */
let loaderTimer = null;
function animateLoader() {
  const steps = ['step-fund','step-tech','step-news','step-synth','step-critic'];
  let i = 0;
  loaderTimer = setInterval(() => {
    if (i > 0) $( steps[i-1] ).className = 'step done';
    if (i < steps.length) $( steps[i] ).className = 'step active';
    i++;
    if (i > steps.length) clearInterval(loaderTimer);
  }, 1800);
}
function resetLoader() {
  clearInterval(loaderTimer);
  ['step-fund','step-tech','step-news','step-synth','step-critic'].forEach(id => {
    $(id).className = 'step';
  });
}

/* ═══════════════════════════════════════════════════
   API CALL
═══════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════
   AUTOCOMPLETE
═══════════════════════════════════════════════════ */
let _allStocks = [];   // [{ticker, name}, ...]
let _acIndex   = -1;   // keyboard nav index

async function loadStocks() {
  try {
    const res = await fetch('/stocks');
    if (res.ok) _allStocks = await res.json();  // ["SBIN", "HDFCBANK", ...]
  } catch(e) { /* fail silently — autocomplete just won't work */ }
}

function _escapeRe(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function showDropdown(query) {
  const list = $('autocomplete-list');
  const q = query.trim().toUpperCase();
  if (!q || _allStocks.length === 0) { hideDropdown(); return; }

  const re = new RegExp(_escapeRe(q), 'i');
  // Prioritise ticker-starts-with, then name-contains
  const matches = _allStocks
    .filter(s => s.toUpperCase().startsWith(q))
    .slice(0, 10);

  if (matches.length === 0) { hideDropdown(); return; }

  _acIndex = -1;
  list.innerHTML = matches.map((s, i) => {
    const tHtml = s.replace(new RegExp(`(${_escapeRe(q)})`, 'i'),
      '<span class="ac-highlight">$1</span>');
    return `<div class="ac-item" data-ticker="${s}" data-idx="${i}"
      onmousedown="pickTicker('${s}')">
      <span class="ac-ticker">${tHtml}</span>
    </div>`;
  }).join('');
  list.style.display = 'block';
}

function hideDropdown() {
  $('autocomplete-list').style.display = 'none';
  _acIndex = -1;
}

function pickTicker(ticker) {
  $('ticker-input').value = ticker;
  hideDropdown();
  runAnalysis();
}

function quickTicker(t) {
  $('ticker-input').value = t;
  $('ticker-input').focus();
}

// Keyboard navigation for dropdown
$('ticker-input').addEventListener('input', e => showDropdown(e.target.value));
$('ticker-input').addEventListener('blur',  ()  => setTimeout(hideDropdown, 150));
$('ticker-input').addEventListener('keydown', e => {
  const list  = $('autocomplete-list');
  const items = list.querySelectorAll('.ac-item');
  if (list.style.display === 'block' && items.length) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _acIndex = Math.min(_acIndex + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('selected', i === _acIndex));
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      _acIndex = Math.max(_acIndex - 1, 0);
      items.forEach((el, i) => el.classList.toggle('selected', i === _acIndex));
      return;
    }
    if (e.key === 'Enter' && _acIndex >= 0) {
      e.preventDefault();
      pickTicker(items[_acIndex].dataset.ticker);
      return;
    }
    if (e.key === 'Escape') { hideDropdown(); return; }
  }
  if (e.key === 'Enter') runAnalysis();
});

// Kick off stock list fetch on page load
loadStocks();

async function runAnalysis() {
  const ticker = $('ticker-input').value.trim();
  const depth  = $('depth-select')?.value;
  if (!ticker) { $('ticker-input').focus(); return; }

  // UI state
  $('analyze-btn').disabled = true;
  $('error-banner').style.display = 'none';
  $('dashboard').style.display = 'none';
  $('loader').style.display = 'block';
  resetLoader();
  animateLoader();

  try {
    const res = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ticker, depth })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Unknown error');
    clearInterval(loaderTimer);
    // Mark all done
    ['step-fund','step-tech','step-news','step-synth','step-critic'].forEach(id => $(id).className = 'step done');
    setTimeout(() => {
      $('loader').style.display = 'none';
      renderDashboard(data);
    }, 600);
  } catch(e) {
    clearInterval(loaderTimer);
    $('loader').style.display = 'none';
    const eb = $('error-banner');
    eb.textContent = '⚠ ' + e.message;
    eb.style.display = 'block';
  } finally {
    $('analyze-btn').disabled = false;
  }
}

$('ticker-input').addEventListener('keydown', e => { if (e.key === 'Enter') runAnalysis(); });

/* ═══════════════════════════════════════════════════
   RENDER HELPERS
═══════════════════════════════════════════════════ */
function barFill(score, max=10) {
  return Math.round((score / max) * 100);
}

function mkTag(label, cls='neutral') {
  return `<span class="tag ${cls}">${label}</span>`;
}

function mkInlineTag(label, cls='neutral') {
  return `<span class="ind-tag tag ${cls}">${label}</span>`;
}

/* ── Score Cards ──────────────────────────────── */
function renderScoreRow(fund, tech, news, synth) {
  const scores = [
    { label: 'Fundamentals', val: fund?.signal_scores?.overall,     sub: 'Revenue · Valuation · Health' },
    { label: 'Technical',    val: tech?.signal_score?.overall,       sub: 'Trend · Momentum · Volume' },
    { label: 'News',         val: news?.signal_score?.overall,       sub: 'Sentiment · Events · Quality' },
    { label: 'Consensus',    val: synth?.signal_agreement?.consensus_score, sub: 'Agent agreement score' },
  ];
  return `<div class="score-row">${scores.map(s => {
    const v = s.val ?? 0;
    const pct = barFill(v);
    const col = scoreColor(v);
    return `<div class="score-card">
      <div class="sc-label">${s.label}</div>
      <div class="sc-value">${s.val != null ? s.val.toFixed(1) : '—'}<span style="font-size:13px;color:var(--text-dim)">/10</span></div>
      <div class="sc-sub">${s.sub}</div>
      <div class="sc-bar"><div class="sc-fill" style="width:${pct}%;background:${col}"></div></div>
    </div>`;
  }).join('')}</div>`;
}

/* ── Verdict Banner ───────────────────────────── */
function renderVerdictBanner(synth, critic) {
  const rec  = synth?.recommendation ?? {};
  const cv   = critic?.critic_verdict ?? {};
  const verdict = cv.critic_adjusted_verdict || rec.verdict || 'N/A';
  const conf = rec.confidence_pct ?? 0;
  const confAdj = conf + (cv.confidence_delta ?? 0);
  const reason = rec.reasoning || cv.critical_miss || '—';
  const horizon = (rec.investment_horizon || '—').replace(/_/g,' ');
  const vc = verdictClass(verdict);

  const catalysts = (rec.key_catalysts || []).map(c => `<span class="catalyst-tag">${c}</span>`).join('');

  return `<div class="verdict-banner">
    <div class="verdict-pill ${vc}">${verdict.toUpperCase()}</div>
    <div class="verdict-details">
      <h3>Analyst Verdict · Horizon: ${horizon}</h3>
      <p>${reason}</p>
      ${catalysts ? `<div class="catalyst-list">${catalysts}</div>` : ''}
    </div>
    <div class="confidence-block">
      <div class="confidence-num">${Math.round(confAdj)}%</div>
      <div class="confidence-label">Confidence</div>
      <div class="conf-bar"><div class="conf-fill" style="width:${confAdj}%"></div></div>
    </div>
  </div>`;
}

/* ── Fundamentals ─────────────────────────────── */
function renderFundamentals(fund) {
  if (!fund) return '<p style="color:var(--text-dim);font-size:13px;">No data available.</p>';
  const snap = fund.current_snapshot ?? {};
  const ic   = fund.industry_comparison ?? {};
  const ss   = fund.signal_scores ?? {};

  const kvItems = [
    { l:'Current Price',   v: fmtPrice(snap.current_price) },
    { l:'Market Cap',      v: snap.market_cap_formatted || '—' },
    { l:'Revenue (TTM)',   v: snap.revenue_ttm_formatted || '—' },
    { l:'EPS (TTM)',       v: snap.eps_ttm != null ? '₹'+fmt(snap.eps_ttm) : '—' },
    { l:'P/E Ratio',       v: snap.pe_ratio != null ? fmt(snap.pe_ratio)+'×' : '—' },
    { l:'P/B Ratio',       v: snap.pb_ratio != null ? fmt(snap.pb_ratio)+'×' : '—' },
    { l:'Dividend Yield',  v: snap.dividend_yield_percent != null ? fmtPct(snap.dividend_yield_percent) : '—' },
    { l:'Free Cash Flow',  v: snap.free_cash_flow_formatted || '—' },
  ];

  const kvHtml = `<div class="kv-grid">${kvItems.map(k =>
    `<div class="kv"><div class="kv-label">${k.l}</div><div class="kv-val">${k.v}</div></div>`
  ).join('')}</div>`;

  // Signal sub-scores
  const subScores = [
    { l:'Revenue Growth', v: ss.revenue_growth },
    { l:'Profitability',  v: ss.profitability },
    { l:'Valuation',      v: ss.valuation },
    { l:'Financial Health', v: ss.financial_health },
  ];
  const subHtml = `<div class="mt-14">
    <div class="section-sub">Signal Scores</div>
    ${subScores.map(s => {
      const col = scoreColor(s.v);
      const pct = barFill(s.v ?? 0);
      return `<div class="indicator-row">
        <span class="ind-name">${s.l}</span>
        <span class="ind-val">${s.v != null ? s.v.toFixed(1)+'/10' : '—'}</span>
      </div>`;
    }).join('')}
  </div>`;

  // Industry comparison
  const icMetrics = [
    { k:'pe_ratio', l:'P/E' },
    { k:'pb_ratio', l:'P/B' },
  ];
  const icHtml = `<div class="mt-14">
    <div class="section-sub">Industry Comparison · ${ic.industry || '—'}</div>
    ${icMetrics.map(m => {
      const d = ic[m.k] ?? {};
      const sv = d.stock ?? 0;
      const iv = d.industry ?? 0;
      const maxV = Math.max(sv, iv, 1);
      const vc2 = d.verdict === 'outperforming' ? 'bull' : d.verdict === 'underperforming' ? 'bear' : 'neutral';
      return `<div class="ic-row">
        <span class="ic-label">${m.l}</span>
        <div class="ic-bars">
          <div class="ic-bar-wrap">
            <div class="ic-bar-bg"><div class="ic-bar-fill stock" style="width:${Math.round((sv/maxV)*100)}%"></div></div>
            <span class="ic-num">${sv != null ? fmt(sv,1) : '—'}</span>
          </div>
          <div class="ic-bar-wrap">
            <div class="ic-bar-bg"><div class="ic-bar-fill ind" style="width:${Math.round((iv/maxV)*100)}%"></div></div>
            <span class="ic-num">${iv != null ? fmt(iv,1) : '—'}</span>
          </div>
        </div>
        <span class="ic-verdict tag ${vc2}">${d.verdict || '—'}</span>
      </div>`;
    }).join('')}
    <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">
      <span style="color:var(--accent)">■</span> Stock &nbsp; <span style="color:var(--border2)">■</span> Industry avg
    </div>
  </div>`;

  return kvHtml + subHtml + icHtml;
}

/* ── Technical ────────────────────────────────── */
function renderTechnical(tech) {
  if (!tech) return '<p style="color:var(--text-dim);font-size:13px;">No data available.</p>';
  const pa   = tech.price_action ?? {};
  const ma   = tech.moving_averages ?? {};
  const rsi  = tech.rsi ?? {};
  const macd = tech.macd ?? {};
  const bb   = tech.bollinger_bands ?? {};
  const tr   = tech.trend ?? {};

  // Price action
  const paRows = [
    { n:'Current Price',    v: fmtPriceRaw(pa.current_price), tag: null },
    { n:'52W High',         v: fmtPriceRaw(pa.week_52_high),  tag: null },
    { n:'52W Low',          v: fmtPriceRaw(pa.week_52_low),   tag: null },
    { n:'From 52W High',    v: pa.pct_from_52w_high != null ? fmtPct(pa.pct_from_52w_high) : '—',
      tag: pa.pct_from_52w_high > 0 ? 'bull' : 'bear' },
    { n:'From 52W Low',     v: pa.pct_from_52w_low != null ? fmtPct(pa.pct_from_52w_low) : '—',
      tag: 'bull' },
    { n:'Avg Vol (30d)',    v: pa.avg_volume_30d != null ? Number(pa.avg_volume_30d).toLocaleString('en-IN',{maximumFractionDigits:0}) : '—', tag: null },
    { n:'Volume Spike',     v: pa.volume_spike ? 'Yes' : 'No', tag: pa.volume_spike ? 'warn' : null },
  ];

  // MA
  const maRows = [
    { n:'MA 20',  v: fmtPriceRaw(ma.ma_20),  tag: null },
    { n:'MA 50',  v: fmtPriceRaw(ma.ma_50),  tag: null },
    { n:'MA 200', v: fmtPriceRaw(ma.ma_200), tag: null },
    { n:'Price vs MA50',   v: ma.price_vs_ma50 || '—',   tag: ma.price_vs_ma50 === 'above' ? 'bull' : 'bear' },
    { n:'Price vs MA200',  v: ma.price_vs_ma200 || '—',  tag: ma.price_vs_ma200 === 'above' ? 'bull' : 'bear' },
    { n:'MA50 vs MA200',   v: ma.ma50_vs_ma200 || '—',   tag: ma.ma50_vs_ma200 === 'above' ? 'bull' : 'bear' },
  ];

  // Oscillators
  const oscRows = [
    { n:'RSI',           v: rsi.current != null ? fmt(rsi.current,1) : '—',
      tag: rsi.zone === 'overbought' ? 'bear' : rsi.zone === 'oversold' ? 'bull' : 'neutral',
      tagLabel: rsi.zone || 'neutral' },
    { n:'MACD Line',     v: macd.macd_line != null ? fmt(macd.macd_line,2) : '—',   tag: null },
    { n:'Signal Line',   v: macd.signal_line != null ? fmt(macd.signal_line,2) : '—', tag: null },
    { n:'Histogram',     v: macd.histogram != null ? fmt(macd.histogram,2) : '—',
      tag: (macd.histogram ?? 0) > 0 ? 'bull' : 'bear' },
    { n:'MACD Crossover',v: macd.crossover || '—',
      tag: macd.crossover?.includes('bullish') ? 'bull' : 'bear',
      tagLabel: macd.crossover || '—' },
  ];

  // Bollinger
  const bbRows = [
    { n:'BB Upper', v: fmtPriceRaw(bb.upper), tag: null },
    { n:'BB Middle',v: fmtPriceRaw(bb.middle), tag: null },
    { n:'BB Lower', v: fmtPriceRaw(bb.lower),  tag: null },
    { n:'BB Bandwidth',v: bb.bandwidth != null ? fmt(bb.bandwidth,2) : '—', tag: null },
    { n:'Price Position',v: bb.price_position || '—', tag: 'neutral' },
    { n:'Squeeze',  v: bb.squeeze ? 'Active' : 'No', tag: bb.squeeze ? 'warn' : null },
  ];

  // Trend
  const trendRows = [
    { n:'Primary Trend',  v: tr.primary_trend || '—',
      tag: tr.primary_trend?.includes('bull') ? 'bull' : tr.primary_trend?.includes('bear') ? 'bear' : 'neutral',
      tagLabel: tr.primary_trend || '—' },
    { n:'Trend Strength', v: tr.trend_strength || '—', tag: null },
    { n:'ADX',            v: tr.adx_value != null ? fmt(tr.adx_value,1) : '—',
      tag: (tr.adx_value ?? 0) > 25 ? 'bull' : 'neutral' },
    { n:'Duration (days)',v: tr.trend_duration_days ?? '—', tag: null },
    { n:'Higher Highs',   v: tr.higher_highs ? 'Yes' : 'No', tag: tr.higher_highs ? 'bull' : 'neutral' },
    { n:'Higher Lows',    v: tr.higher_lows  ? 'Yes' : 'No', tag: tr.higher_lows  ? 'bull' : 'neutral' },
  ];

  const mkRows = rows => rows.map(r => `<div class="indicator-row">
    <span class="ind-name">${r.n}</span>
    <span>${r.tag ? mkInlineTag(r.tagLabel || r.v, r.tag) : `<span class="ind-val">${r.v}</span>`}</span>
  </div>`).join('');

  // Flags
  const flags = (tech.technical_flags || []).map(f => {
    const cls = f.severity === 'critical' ? 'critical' : f.severity === 'high' ? 'warn' : 'ok';
    return `<div class="flag-card ${cls}">
      <span class="flag-icon">${f.severity === 'critical' ? '🔴' : '⚠️'}</span>
      <span class="flag-msg">${f.message}</span>
      <span class="flag-act">${f.action || ''}</span>
    </div>`;
  }).join('') || '<div style="color:var(--text-dim);font-size:12px;">No critical flags.</div>';

  // Cross signals
  const crossHtml = (tech.cross_signals || []).map(c => {
    const cls = c.signal_type === 'death_cross' ? 'critical' : 'ok';
    const icon = c.signal_type === 'death_cross' ? '💀' : '✨';
    return `<div class="flag-card ${cls}">
      <span class="flag-icon">${icon}</span>
      <span class="flag-msg">${c.description}</span>
      <span class="flag-act">${c.date || ''}</span>
    </div>`;
  }).join('');

  // S&R
  const srHtml = (tech.support_resistance || []).length ? `
    <table class="sr-table">
      <thead><tr>
        <th>Price</th><th>Type</th><th>Strength</th><th>Touches</th><th>Distance</th>
      </tr></thead>
      <tbody>${(tech.support_resistance || []).map(sr => {
        const tc = sr.level_type === 'resistance' ? 'bear' : 'bull';
        return `<tr>
          <td>${fmtPriceRaw(sr.price)}</td>
          <td>${mkTag(sr.level_type || '—', tc)}</td>
          <td>${mkTag(sr.strength || '—', 'neutral')}</td>
          <td>${sr.touches ?? '—'}</td>
          <td style="color:${(sr.distance_pct??0)>0?'var(--bull)':'var(--bear)'}">${fmtPct(sr.distance_pct)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>` : '<p style="color:var(--text-dim);font-size:12px;">No S&R levels detected.</p>';

  return `
    <div class="section-sub">Price Action</div>${mkRows(paRows)}
    <div class="section-sub">Moving Averages</div>${mkRows(maRows)}
    <div class="section-sub">Oscillators</div>${mkRows(oscRows)}
    <div class="section-sub">Bollinger Bands</div>${mkRows(bbRows)}
    <div class="section-sub">Trend</div>${mkRows(trendRows)}
    <div class="section-sub">Technical Flags</div>${flags}
    ${crossHtml ? `<div class="section-sub">Cross Signals</div>${crossHtml}` : ''}
    <div class="section-sub">Support &amp; Resistance</div>${srHtml}
  `;
}

/* ── News ─────────────────────────────────────── */
function renderNews(news) {
  if (!news) return '<p style="color:var(--text-dim);font-size:13px;">No data available.</p>';
  const sb  = news.sentiment_breakdown ?? {};
  const ss  = news.signal_score ?? {};
  const pos = sb.positive_percent ?? 0;
  const neg = sb.negative_percent ?? 0;
  const neu = 100 - pos - neg;

  // Donut
  const r = 30, cx = 40, cy = 40;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const slices = [
    { pct: pos, col: '#34d399' },
    { pct: neg, col: '#f87171' },
    { pct: neu, col: '#475569' },
  ];
  const donutSlices = slices.map(s => {
    const len = (s.pct / 100) * circ;
    const gap = circ - len;
    const svg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.col}" stroke-width="10"
      stroke-dasharray="${len} ${gap}" stroke-dashoffset="${-offset}" />`;
    offset += len;
    return svg;
  }).join('');
  const donutSvg = `<svg width="80" height="80" viewBox="0 0 80 80">${donutSlices}</svg>`;

  const sentHtml = `<div class="sentiment-row">
    <div class="donut-wrap">
      ${donutSvg}
      <div class="donut-center">${Math.round(ss.overall ?? 0)}</div>
    </div>
    <div class="sent-breakdown">
      <div class="sent-item"><div class="sent-dot" style="background:#34d399"></div><span class="sent-name">Positive</span><span class="sent-pct">${fmtPct(pos)}</span></div>
      <div class="sent-item"><div class="sent-dot" style="background:#f87171"></div><span class="sent-name">Negative</span><span class="sent-pct">${fmtPct(neg)}</span></div>
      <div class="sent-item"><div class="sent-dot" style="background:#475569"></div><span class="sent-name">Neutral</span><span class="sent-pct">${fmtPct(neu)}</span></div>
    </div>
  </div>`;

  // Signal sub-scores
  const sigRows = [
    { n:'News Sentiment', v: ss.news_sentiment },
    { n:'Event Severity', v: ss.event_severity },
    { n:'Source Quality', v: ss.source_quality },
    { n:'Recency',        v: ss.recency },
  ].map(s => `<div class="indicator-row">
    <span class="ind-name">${s.n}</span>
    <span class="ind-val" style="color:${scoreColor(s.v)}">${s.v != null ? s.v.toFixed(1) : '—'}/10</span>
  </div>`).join('');

  // High-impact events
  const eventsHtml = (news.all_high_impact_events || []).map(e => {
    const ic = e.impact === 'bullish' ? 'bull' : 'bear';
    return `<div class="flag-card ${e.severity === 'high' ? 'warn' : 'ok'}">
      <span class="flag-icon">${e.impact === 'bullish' ? '⬆️' : '⬇️'}</span>
      <span class="flag-msg">${e.description}</span>
      ${mkTag(e.impact||'—', ic)}
    </div>`;
  }).join('') || '<p style="color:var(--text-dim);font-size:12px;">No high-impact events.</p>';

  // Articles
  const articlesHtml = (news.analyzed_articles || []).slice(0,5).map(a => {
    const sc = a.sentiment?.label?.toLowerCase() || 'neutral';
    const sc2 = sc === 'positive' ? 'bull' : sc === 'negative' ? 'bear' : 'neutral';
    return `<div class="news-card">
      <div class="news-title">${a.url
        ? `<a href="${a.url}" target="_blank" rel="noopener">${a.title}</a>`
        : a.title}</div>
      <div class="news-summary">${a.one_line_summary || '—'}</div>
      <div class="news-meta">
        <span class="news-source">${a.source || '—'}</span>
        ${mkTag(a.sentiment?.label || 'Neutral', sc2)}
        ${a.relevance_score != null ? `<span style="font-size:11px;color:var(--text-dim)">relevance ${fmtPct(a.relevance_score*100)}</span>` : ''}
      </div>
    </div>`;
  }).join('');

  const meta = news.metadata ?? {};
  return `
    <div class="section-sub">Sentiment Overview</div>
    ${sentHtml}
    <div class="section-sub">Signal Sub-Scores</div>
    ${sigRows}
    <div class="section-sub">High-Impact Events</div>
    ${eventsHtml}
    <div class="section-sub">Articles Analyzed (${meta.articles_analyzed ?? '—'} of ${meta.articles_fetched ?? '—'})</div>
    ${articlesHtml || '<p style="color:var(--text-dim);font-size:12px;">No articles.</p>'}
  `;
}

/* ── Critic ───────────────────────────────────── */
function renderCritic(critic) {
  if (!critic) return '<p style="color:var(--text-dim);font-size:13px;">No data available.</p>';
  const cv = critic.critic_verdict ?? {};

  // Summary row
  const summaryHtml = `<div class="kv-grid">
    <div class="kv"><div class="kv-label">Synthesis Verdict</div><div class="kv-val">${cv.synthesis_verdict || '—'}</div></div>
    <div class="kv"><div class="kv-label">Critic Adjusted</div><div class="kv-val">${cv.critic_adjusted_verdict || '—'}</div></div>
    <div class="kv"><div class="kv-label">Confidence Δ</div>
      <div class="kv-val" style="color:${(cv.confidence_delta??0)<0?'var(--bear)':'var(--bull)'}">${cv.confidence_delta != null ? (cv.confidence_delta > 0 ? '+' : '') + cv.confidence_delta + '%' : '—'}</div></div>
    <div class="kv"><div class="kv-label">Stance</div><div class="kv-val">${cv.overall_stance || '—'}</div></div>
  </div>`;

  if (cv.critical_miss) {
    summaryHtml;
  }

  // Bear case
  const bearHtml = (critic.bear_case || []).map(b => `<div class="risk-card">
    <div class="risk-title">${b.argument}</div>
    <div class="risk-desc">Invalidates: ${b.invalidates || '—'}</div>
    <div class="risk-badges">
      ${mkTag('Prob: ' + (b.probability||'—'), 'bear')}
      ${mkTag(b.severity||'—', b.severity === 'high' ? 'bear' : 'warn')}
      ${mkTag(b.source||'—', 'neutral')}
    </div>
  </div>`).join('') || '<p style="color:var(--text-dim);font-size:12px;">No bear arguments.</p>';

  // Risks
  const risksHtml = (critic.risks_to_monitor || []).map(r => `<div class="risk-card ${r.severity === 'critical' ? '' : 'warn'}">
    <div class="risk-title">${r.description}</div>
    <div class="risk-desc">Trigger: ${r.trigger || '—'} · Horizon: ${r.time_horizon || '—'}</div>
    <div class="risk-badges">
      ${mkTag(r.severity||'—', r.severity === 'critical' ? 'bear' : 'warn')}
      ${mkTag(r.category||'—', 'neutral')}
    </div>
  </div>`).join('') || '<p style="color:var(--text-dim);font-size:12px;">No risks flagged.</p>';

  // Data gaps
  const gapsHtml = (critic.data_gaps || []).map(g => `<div class="gap-card">
    <span class="gap-icon">🔍</span>
    <div class="gap-text">
      <div class="gap-id">${g.gap_id} · Impact: ${g.impact}</div>
      <div class="gap-desc">${g.description}</div>
      <div class="gap-rec">${g.recommendation || '—'}</div>
    </div>
  </div>`).join('') || '<p style="color:var(--text-dim);font-size:12px;">No data gaps found.</p>';

  return `
    <div class="section-sub">Critic Verdict</div>
    ${summaryHtml}
    ${cv.critical_miss ? `<div class="risk-card mt-10"><div class="risk-title">⚠ Critical Miss</div><div class="risk-desc">${cv.critical_miss}</div></div>` : ''}
    <div class="section-sub">Bear Case</div>${bearHtml}
    <div class="section-sub">Risks to Monitor</div>${risksHtml}
    <div class="section-sub">Data Gaps</div>${gapsHtml}
  `;
}

/* ── Synthesis (signal alignment) ────────────── */
function renderSynthesis(synth) {
  if (!synth) return '';
  const sa = synth.signal_agreement ?? {};
  const aligns = synth.signal_alignments || [];

  const divergenceHtml = sa.divergence_flag
    ? `<div class="flag-card warn mt-10">
        <span class="flag-icon">⚡</span>
        <span class="flag-msg">${sa.divergence_detail || 'Signal divergence detected'}</span>
      </div>` : '';

  const alignHtml = aligns.map(a => {
    const col = scoreColor(a.score);
    const dc  = dirClass(a.direction);
    const pct = barFill(a.score ?? 0);
    return `<div class="align-row">
      <span class="align-agent">${a.agent}</span>
      <div class="align-bar-wrap"><div class="align-bar" style="width:${pct}%;background:${col}"></div></div>
      <span class="align-score">${a.score != null ? a.score.toFixed(1) : '—'}</span>
      <span class="dir-tag tag ${dc}">${dirLabel(a.direction)}</span>
    </div>`;
  }).join('');

  const agrHtml = `<div style="font-size:12px;color:var(--text-dim);margin-top:10px;">
    Agreeing: ${(sa.agreeing_agents||[]).join(', ')||'—'} &nbsp;·&nbsp; 
    Disagreeing: ${(sa.disagreeing_agents||[]).join(', ')||'—'}
  </div>`;

  return `
    <div class="section-sub">Agent Signal Alignment</div>
    ${alignHtml}
    ${agrHtml}
    ${divergenceHtml}
  `;
}

/* ═══════════════════════════════════════════════════
   MAIN RENDER
═══════════════════════════════════════════════════ */
function renderDashboard(data) {
  const fund  = data.fundamentals_output;
  const tech  = data.technical_output;
  const news  = data.news_output;
  const synth = data.synthesis_output;
  const critic= data.critic_output;

  const meta    = fund?.metadata ?? tech?.metadata ?? {};
  const ticker  = data.ticker || meta.ticker || '—';
  const company = meta.company_name || fund?.metadata?.company_name || '—';
  const ts      = meta.analysis_timestamp ? new Date(meta.analysis_timestamp).toLocaleString() : '—';

  // Company header
  const companyHtml = `<div class="company-header">
    <div class="company-title">
      <h2>${company} <span class="ticker-badge">${ticker}</span></h2>
      <div class="company-meta">
        ${meta.sector  ? `<span class="meta-pill">🏛 ${meta.sector}</span>` : ''}
        ${meta.industry? `<span class="meta-pill">⚙ ${meta.industry}</span>` : ''}
        ${meta.exchange? `<span class="meta-pill">📍 ${meta.exchange}</span>` : ''}
        ${meta.currency? `<span class="meta-pill">💱 ${meta.currency}</span>` : ''}
      </div>
    </div>
    <div class="price-block">
      <div class="price">${fmtPrice(fund?.current_snapshot?.current_price ?? tech?.price_action?.current_price)}</div>
      <div class="price-sub">As of analysis · ${ts}</div>
      <div class="price-sub" style="margin-top:4px;">
        ${mkTag('Elapsed: '+data.elapsed_seconds+'s', 'neutral')}
      </div>
    </div>
  </div>`;

  const synthSub = synth ? `<div class="section-card full-width">
    <div class="section-header">
      <span class="section-icon">🔗</span>
      <span class="section-title">Synthesis — Signal Alignment</span>
      <span class="section-score">${synth.signal_agreement?.consensus_score?.toFixed(1) ?? '—'}/10</span>
    </div>
    <div class="section-body">${renderSynthesis(synth)}</div>
  </div>` : '';

  const html = `
    ${companyHtml}
    ${renderVerdictBanner(synth, critic)}
    ${renderScoreRow(fund, tech, news, synth)}
    ${synthSub}
    <div class="sections-grid">
      <div class="section-card">
        <div class="section-header">
          <span class="section-icon">📊</span>
          <span class="section-title">Fundamentals</span>
          <span class="section-score">${fund?.signal_scores?.overall?.toFixed(1) ?? '—'}/10</span>
        </div>
        <div class="section-body">${renderFundamentals(fund)}</div>
      </div>
      <div class="section-card">
        <div class="section-header">
          <span class="section-icon">📈</span>
          <span class="section-title">Technical Analysis</span>
          <span class="section-score">${tech?.signal_score?.overall?.toFixed(1) ?? '—'}/10</span>
        </div>
        <div class="section-body" style="max-height:700px;overflow-y:auto;">${renderTechnical(tech)}</div>
      </div>
      <div class="section-card">
        <div class="section-header">
          <span class="section-icon">📰</span>
          <span class="section-title">News &amp; Sentiment</span>
          <span class="section-score">${news?.signal_score?.overall?.toFixed(1) ?? '—'}/10</span>
        </div>
        <div class="section-body" style="max-height:700px;overflow-y:auto;">${renderNews(news)}</div>
      </div>
      <div class="section-card">
        <div class="section-header">
          <span class="section-icon">🔍</span>
          <span class="section-title">Critic Report</span>
        </div>
        <div class="section-body" style="max-height:700px;overflow-y:auto;">${renderCritic(critic)}</div>
      </div>
    </div>
    <div class="dash-footer">
      StockMind · Multi-Agent Research · ${ts} · ${ticker} · elapsed ${data.elapsed_seconds}s
    </div>
  `;

  const db = $('dashboard');
  db.innerHTML = html;
  db.style.display = 'block';
  $('header-ts').textContent = `${ticker} · ${company} · ${ts}`;

  // Animate bars after render
  setTimeout(() => {
    document.querySelectorAll('.sc-fill, .ic-bar-fill, .align-bar, .conf-fill').forEach(el => {
      const w = el.style.width;
      el.style.width = '0';
      setTimeout(() => el.style.width = w, 50);
    });
  }, 100);
}
</script>
</body>
</html>
